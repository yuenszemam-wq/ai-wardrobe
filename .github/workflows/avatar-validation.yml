name: Avatar and wardrobe validation
on:
  push:
    branches: [feature/phase3.1-mesh-skinning]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm install --no-save --package-lock=false esbuild sharp playwright
      - run: node test/doll-logic.mjs
      - run: node test/phase35.mjs
      - run: node test/doll-api.mjs
      - run: node test/e2e.mjs
      - run: node test/taxonomy.mjs
      - run: node test/v4.mjs
      - run: node test/organize.mjs
      - run: npx playwright install --with-deps chromium
      - run: node test/doll-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/mesh-integrity.mjs
      - run: node test/doll-camera.mjs
      - run: node test/doll-split.mjs
      - run: node test/phase34.mjs
        if: always()
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/shots-log.mjs shots
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doll-screenshots
          path: shots
          if-no-files-found: ignore
          retention-days: 7
