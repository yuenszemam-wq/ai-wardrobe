name: Avatar and wardrobe validation
on:
  push:
    branches: [feature/phase3.1-mesh-skinning]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm install --no-save --package-lock=false esbuild sharp playwright
      - run: node test/doll-logic.mjs
      - run: node test/phase35.mjs
      - run: node test/phase36.mjs
      - run: node test/doll-api.mjs
      - run: node test/e2e.mjs
      - run: node test/taxonomy.mjs
      - run: node test/v4.mjs
      - run: node test/organize.mjs
      - run: node test/image-cache.mjs
      - run: node test/phase38a1.mjs
      - run: node test/phase38b.mjs
      - run: node test/phase38b1.mjs
      - run: node test/phase39a1.mjs
      - run: node test/phase39a11.mjs
      - run: node test/phase39a2.mjs
      - run: node test/phase39a21.mjs
      - run: node test/phase39a3.mjs
      - run: node test/phase38c.mjs
      - run: node test/phase39b1.mjs
      - run: node test/phase39b2.mjs
      - run: node test/phase37.mjs
      - run: node test/d1-limits.mjs
      - run: node test/ai-lab.mjs
      - run: npx playwright install --with-deps chromium
      - run: node test/doll-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase35-ui.mjs
      - run: node test/phase36-ui.mjs
      - run: node test/mesh-integrity.mjs
      - run: node test/doll-camera.mjs
      - run: node test/doll-split.mjs
      - run: node test/phase38.mjs
      - run: node test/phase38-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38-wardrobe.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38-home.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38a1-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38a1-home.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38a2-theme.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38a2-dress.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38a2-home.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38b-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38b1-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase39a1-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase39a11-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase39a11-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
          PW_DEVICE: iPhone SE
      - run: node test/phase39a2-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase39a21-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase39a3-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase38c-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase39b1-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/phase39b2-ui.mjs
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      # Playwright WebKit（Safari 引擎；不等於 iPhone 實機）：結果如實記錄，暫不阻擋合併
      - run: npx playwright install --with-deps webkit
        continue-on-error: true
      - run: node test/phase39a11-ui.mjs
        continue-on-error: true
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots-webkit
          PW_BROWSER: webkit
      - run: node test/phase39a2-ui.mjs
        continue-on-error: true
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots-webkit
          PW_BROWSER: webkit
      - run: node test/phase39a21-ui.mjs
        continue-on-error: true
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots-webkit
          PW_BROWSER: webkit
      - run: node test/phase34.mjs
        if: always()
        env:
          DOLL_SHOTS: ${{ github.workspace }}/shots
      - run: node test/shots-log.mjs shots
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doll-screenshots
          path: shots
          if-no-files-found: ignore
          retention-days: 7
